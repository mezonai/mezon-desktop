[graph]
all-features = true

[bans]
multiple-versions = "warn"

[advisories]
unmaintained = "workspace"
# Pre-existing advisories in vendored/transitive dependencies (the gpui 0.2.2
# Zed snapshot and its font/svg/git stack). Tracked for separate remediation and
# ignored here so the CI gate fails on NEW advisories our own crates introduce.
ignore = [
    "RUSTSEC-2024-0415", # gtk3 bindings unmaintained (transitive, linux)
    "RUSTSEC-2026-0183", # git2/libgit2 Remote::list unsound (transitive)
    "RUSTSEC-2026-0184", # git2/libgit2 BlameHunk Signature unsound (transitive)
    "RUSTSEC-2026-0192", # ttf-parser unmaintained (vendored font stack)
    "RUSTSEC-2026-0194", # quick-xml quadratic attribute check (usvg/resvg)
    "RUSTSEC-2026-0195", # quick-xml namespace-declaration alloc DoS (usvg/resvg)
"RUSTSEC-2026-0274", # rtrb ReadChunk::commit double-free (libwebrtc -> livekit)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
    "CDLA-Permissive-2.0",
    # File-level copyleft, used unmodified: cbindgen (build-only), dwrote,
    # option-ext, symphonia (audio decode).
    "MPL-2.0",
    # Permissive: foldhash, nanorand, slotmap.
    "Zlib",
    # Public domain: hexf-parse, tiny-keccak.
    "CC0-1.0",
    # Public domain: ksni (Linux StatusNotifierItem tray).
    "Unlicense",
    # libfuzzer-sys: (MIT OR Apache-2.0) AND NCSA.
    "NCSA",
    # libbz2-rs-sys: the permissive BSD-style bzip2 license.
    "bzip2-1.0.6",
    # The vendored Zed UI cluster (ui, component, theme, icons, menu, ui_macros,
    # zlog, ztracing, syntax_theme, gpui_util) is GPL-3.0-or-later, so this app is
    # a GPL-3 derivative work. The workspace license matches.
    "GPL-3.0-or-later",
]