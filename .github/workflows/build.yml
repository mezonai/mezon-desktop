name: Build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      NX_CHAT_APP_API_HOST: api.mezon.ai
      NX_CHAT_APP_API_PORT: "443"
      NX_CHAT_APP_API_SECURE: "true"
      NX_CHAT_APP_API_KEY: ${{ secrets.NX_CHAT_APP_API_KEY }}
      NX_CHAT_APP_API_GW_HOST: gw.mezon.ai
      NX_CHAT_APP_API_GW_PORT: "443"
      NX_CHAT_APP_TCP_PORT: ""
      NX_CHAT_APP_STREAM_WS_URL: wss://stn.mezon.ai
      NX_CHAT_APP_MEET_WS_URL: wss://meet.mezon.ai
      NX_CHAT_APP_NOTIFICATION_WS_URL: wss://gotify.mezon.ai
      NX_CHAT_APP_OAUTH2_AUTHORIZE_URL: https://oauth2.mezon.ai/oauth2/auth
      NX_CHAT_APP_OAUTH2_CLIENT_ID: f049f29e-12a9-464c-938f-0a2f60c3210b
      NX_CHAT_APP_OAUTH2_REDIRECT_URI: https://mezon.ai/login/callback
      NX_CHAT_APP_OAUTH2_RESPONSE_TYPE: code
      NX_CHAT_APP_OAUTH2_SCOPE: openid+offline
      NX_CHAT_APP_OAUTH2_CODE_CHALLENGE_METHOD: S256
      NX_CHAT_APP_OAUTH2_LOG_OUT: https://oauth2.mezon.ai/oauth2/sessions/logout
      NX_CHAT_APP_OAUTH2_LOG_OUT_CALLBACK: https://mezon.ai/logout/callback
      NX_CHAT_APP_GOOGLE_CLIENT_ID: 391688022389-1k9kb377ea6dccpqii7m5pifjj0agsjc.apps.googleusercontent.com
      NX_DOMAIN_URL: https://mezon.ai
      NX_CHAT_APP_REDIRECT_URI: https://mezon.ai
      NX_LOGO_MEZON: https://cdn.komu.vn/images/mezon_logo.png
      NX_BASE_IMG_URL: https://cdn.komu.vn
      NX_UPLOAD_IMG_URL: https://cdn-api.mezon.ai
      NX_PROFILE_IMG_URL: https://profile.mezon.ai
      NX_IMGPROXY_BASE_URL: https://imgproxy.komu.vn
      NX_IMGPROXY_KEY: ${{ secrets.NX_IMGPROXY_KEY }}
      NX_CHAT_APP_API_KLIPY_KEY: ${{ secrets.NX_CHAT_APP_API_KLIPY_KEY }}
      NX_CHAT_APP_API_KLIPY_URL: https://api.klipy.com/api/v1
      NX_CHAT_APP_MEZON_TREASURY_URL: https://withdraw-api.nccsoft.vn
      NX_CHAT_APP_API_MEZONTREASURY_KEY: ${{ secrets.NX_CHAT_APP_API_MEZONTREASURY_KEY }}
      NX_CHAT_APP_CONTRACT_ADDRESS: "0x4F17a94dD6E1B2D6241C4D1956C6c7a07ba2Ec50"
      NX_CHAT_APP_MEZON_TREASURY_URL_NETWORK: https://sepolia.etherscan.io
      NX_CHAT_APP_MMN_API_URL: https://dong.mezon.ai/mmn-api/
      NX_CHAT_APP_ZK_API_URL: https://dong.mezon.ai/zk-api/
      NX_CHAT_APP_INDEXER_API_URL: https://dong.mezon.ai/indexer-api/
      NX_CHAT_APP_DONG_SERVICE_API_URL: ${{ secrets.NX_CHAT_APP_DONG_SERVICE_API_URL }}
      NX_WEBRTC_ICESERVERS_URL: turn:relay.mezon.ai:5349
      NX_WEBRTC_ICESERVERS_USERNAME: turnmezon
      NX_WEBRTC_ICESERVERS_CREDENTIAL: ${{ secrets.NX_WEBRTC_ICESERVERS_CREDENTIAL }}
      NX_CHAT_APP_FCM_API_KEY: ${{ secrets.NX_CHAT_APP_FCM_API_KEY }}
      NX_CHAT_APP_FCM_AUTH_DOMAIN: mezon-772fa.firebaseapp.com
      NX_CHAT_APP_FCM_PROJECT_ID: mezon-772fa
      NX_CHAT_APP_FCM_STORAGE_BUCKET: mezon-772fa.appspot.com
      NX_CHAT_APP_FCM_MESSAGING_SENDER_ID: "285548761692"
      NX_CHAT_APP_FCM_APP_ID: "1:285548761692:web:3ca531af1deecee74e0c99"
      NX_CHAT_APP_FCM_MEASUREMENT_ID: G-0WNQTXVMT3
      NX_CHAT_APP_FCM_VAPID_KEY: ${{ secrets.NX_CHAT_APP_FCM_VAPID_KEY }}
      NX_CHAT_APP_API_CLIENT_KEY_CUSTOM: mezon.ai
      NX_CHAT_SENTRY_DSN: ${{ secrets.NX_CHAT_SENTRY_DSN }}
      NX_CHAT_APP_ANNONYMOUS_USER_ID: "1767478432163172999"
      NX_MAX_LENGTH_NAME_ALLOWED: "64"
      NX_UPDATE_URL: ${{ secrets.NX_UPDATE_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact_name: mezon-linux-x86_64
            container: ubuntu:22.04
          # Temporarily disabled: only build Linux artifacts.
          # - os: windows-latest
          #   name: Windows
          #   artifact_name: mezon-windows-x86_64
          # - os: macos-latest
          #   name: macOS
          #   artifact_name: mezon-macos-aarch64

    steps:
      - name: Install container prerequisites
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl openssl zstd

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Ensure Metal toolchain is available
        if: runner.os == 'macOS'
        run: |
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
          xcrun -f metal

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-07-12
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps

      - name: Build release binary
        run: cargo build --release -p mezon-app --locked

      - name: Bundle macOS app
        if: runner.os == 'macOS'
        run: |
          app="target/release/bundle/Mezon.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp crates/mezon-app/Info.plist "$app/Contents/Info.plist"
          cp target/release/mezon "$app/Contents/MacOS/mezon"
          chmod +x "$app/Contents/MacOS/mezon"
          for icon in assets/icons/app.icns crates/mezon-app/app.icns assets/app.icns; do
            if [ -f "$icon" ]; then cp "$icon" "$app/Contents/Resources/app.icns"; break; fi
          done
          codesign --force --deep --sign - "$app" >/dev/null 2>&1 || true
          ditto -c -k --keepParent "$app" "target/release/bundle/Mezon-macos-aarch64.zip"

      - name: Build .deb package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p mezon-app --locked

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/release/mezon
            target/debian/*.deb
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/mezon.exe
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/release/mezon
            target/release/bundle/Mezon-macos-aarch64.zip
          if-no-files-found: error
