name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      # Same script the pre-commit hook runs, so the two can never drift:
      # the fmt scope is defined once, in scripts/fmt.sh.
      - name: Check formatting
        run: ./scripts/fmt.sh check

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Ensure Metal toolchain is available
        run: |
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
          xcrun -f metal

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Lint Mezon crates
        run: just lint

  windows-check:
    name: Windows Check
    # Disabled by default: set ENABLE_WINDOWS_BUILD=true to restore this check.
    if: ${{ vars.ENABLE_WINDOWS_BUILD == 'true' }}
    runs-on: windows-latest
    # Compile-verification only: this is the sole gate that builds the vendored
    # gpui_windows platform crate, and the repo rule is to never lint vendored
    # code. Owned-crate lints are already covered by the macOS `lint` job.
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-07-12
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check Windows platform crates
        run: cargo check -p mezon-app --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    # Building the tests compiles the vendored Linux crates (libspa, zed-scap,
    # gpui_linux), and the repo rule is to never lint vendored code - a path
    # dependency gets no cap-lints, so the workflow-wide `-D warnings` turns
    # their upstream warnings into build failures. Owned-crate lints are covered
    # by the macOS `lint` job, same as the `windows-check` job below.
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: ./scripts/linux-deps

      - name: Install just and nextest
        run: |
          cargo install just --locked
          cargo install cargo-nextest --locked

      - name: Run tests
        run: just test

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check advisories and bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans
