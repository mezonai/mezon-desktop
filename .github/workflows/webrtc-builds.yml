name: WebRTC builds

on:
  push:
    tags:
      - "webrtc-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build webrtc (${{ matrix.target.name }}-${{ matrix.target.arch }}-release)
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: win
            os: windows-2022
            cmd: .\build_windows.cmd
            arch: x64
          - name: mac
            os: macos-latest
            cmd: ./build_macos.sh
            arch: arm64
          - name: mac
            os: macos-latest
            cmd: ./build_macos.sh
            arch: x64
          - name: linux
            os: ubuntu-latest
            cmd: ./build_linux.sh
            arch: x64
          - name: linux
            os: ubuntu-latest
            cmd: ./build_linux.sh
            arch: arm64

    steps:
      - name: Setup variables
        id: setup
        shell: bash
        run: |
          OUT=${{ matrix.target.name }}-${{ matrix.target.arch }}-release
          echo "OUT=$OUT" >> "$GITHUB_OUTPUT"
          echo "ZIP=webrtc-$OUT.zip" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065

      - name: Install setuptools
        if: runner.os != 'macOS'
        run: pip3 install setuptools

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update -y
          sudo apt install -y ninja-build pkg-config

      - name: Select Xcode 26.0
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip" -OutFile ninja.zip
          Expand-Archive -Path ninja.zip -DestinationPath ${{ github.workspace }}\ninja
          echo "${{ github.workspace }}\ninja" | Out-File -Append -Encoding utf8 -FilePath $Env:GITHUB_PATH

      - name: Target OS
        shell: bash
        working-directory: scripts/webrtc
        run: echo -e "\ntarget_os = [\"${{ matrix.target.name }}\"]" >> .gclient

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: true
          tool-cache: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build WebRTC
        working-directory: scripts/webrtc
        run: ${{ matrix.target.cmd }} --arch ${{ matrix.target.arch }} --profile release

      - name: Zip artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd scripts/webrtc
          zip "${{ github.workspace }}/${{ steps.setup.outputs.ZIP }}" "${{ steps.setup.outputs.OUT }}" -r

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path .\scripts\webrtc\${{ steps.setup.outputs.OUT }} -DestinationPath ${{ steps.setup.outputs.ZIP }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webrtc-builds-${{ steps.setup.outputs.OUT }}
          path: ${{ steps.setup.outputs.ZIP }}
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/webrtc-')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: webrtc-builds-*
          merge-multiple: true
          path: webrtc-builds

      - name: Publish release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" webrtc-builds/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" webrtc-builds/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Prebuilt libwebrtc for crates/vendor/webrtc-sys, built by scripts/webrtc from webrtc-sdk/webrtc." \
              --prerelease \
              --latest=false
          fi
