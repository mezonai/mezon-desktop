[package]
name = "webrtc-sys"
version = "0.3.41"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Unsafe bindings to libwebrtc, vendored from livekit/rust-sdks"
repository = "https://github.com/livekit/rust-sdks"
build = "build.rs"

[features]
default = []

[lib]
name = "webrtc_sys"
path = "src/lib.rs"

[dependencies]
cxx = "1.0"
log.workspace = true

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }
cxx-build = "1.0"
glob = "0.3"
pkg-config = "0.3.22"
webrtc-sys-build = { path = "../webrtc-sys-build" }

[lints.rust]
warnings = "allow"

[lints.clippy]
all = "allow"
