[package]
name = "mezon-voice"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mezon-rtc = { path = "../rtc/mezon-rtc" }
mezon-sfu-client = { path = "../rtc/mezon-sfu-client" }
mezon-codec = { path = "../rtc/mezon-codec" }
cpal = { workspace = true }
tokio = { workspace = true }
flume = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

scap = { workspace = true }
nokhwa = { version = "0.10", default-features = false }

image = { workspace = true }
yuv = { workspace = true }
libwebrtc = { workspace = true }
mezon-record = { path = "../mezon-record" }
tiny-skia = "0.11"
cosmic-text = "0.19"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
scap = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
scap = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-avfoundation"] }
core-video.workspace = true
screencapturekit = "0.2.8"
screencapturekit-sys = "0.2.8"
core-graphics-helmer-fork = "0.24.0"
cocoa = "0.25.0"
objc = "0.2.7"
block = "0.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-v4l"] }
libc = "0.2"
xcb = "1.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }
mezon-native.workspace = true
windows-capture = "2.0"
windows = { workspace = true }
