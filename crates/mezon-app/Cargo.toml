[package]
name = "mezon-app"
version.workspace = true
edition = "2024"
default-run = "mezon"
authors.workspace = true
license.workspace = true
description = "Mezon desktop - voice, video and text chat"

[[bin]]
name = "mezon"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
mezon-ui.workspace = true
mezon-store.workspace = true
mezon-native.workspace = true
mezon-updater.workspace = true
mezon-client.workspace = true
mezon-cli.workspace = true
mezon-mcp.workspace = true
flume.workspace = true
reqwest_client.workspace = true
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tracing-tracy = { version = "0.11.4", features = ["enable", "ondemand"], optional = true }
tracy-client = { version = "0.18.2", features = ["enable", "ondemand"], optional = true }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[features]
tracy = ["dep:tracing-tracy", "dep:tracy-client"]

[build-dependencies]
woff2-patched = "0.4.0"
embed-resource.workspace = true

[package.metadata.deb]
name = "mezon"
revision = ""
maintainer = "Mezon Team"
copyright = "2026, Mezon Team"
section = "net"
priority = "optional"
depends = "$auto, libgdk-pixbuf-2.0-0, libasound2, libsecret-1-0, libpipewire-0.3-0, libdbus-1-3, libxcb1, libx11-6, libxkbcommon0, libva2, libva-drm2, libwayland-client0, libwayland-egl1, libegl1, libvulkan1, libfontconfig1, libfreetype6, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-libav"
recommends = "pkexec | policykit-1"
extended-description = "Mezon desktop client (Rust/GPUI) for voice, video and text chat."
maintainer-scripts = "../../packaging/linux/debian"
assets = [
    ["target/release/mezon", "usr/bin/", "755"],
    ["../../packaging/linux/mezon.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/mezon.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/icons/48x48/mezon.png", "usr/share/pixmaps/mezon.png", "644"],
    ["../../packaging/linux/icons/16x16/mezon.png", "usr/share/icons/hicolor/16x16/apps/mezon.png", "644"],
    ["../../packaging/linux/icons/24x24/mezon.png", "usr/share/icons/hicolor/24x24/apps/mezon.png", "644"],
    ["../../packaging/linux/icons/32x32/mezon.png", "usr/share/icons/hicolor/32x32/apps/mezon.png", "644"],
    ["../../packaging/linux/icons/48x48/mezon.png", "usr/share/icons/hicolor/48x48/apps/mezon.png", "644"],
    ["../../packaging/linux/icons/64x64/mezon.png", "usr/share/icons/hicolor/64x64/apps/mezon.png", "644"],
    ["../../packaging/linux/icons/128x128/mezon.png", "usr/share/icons/hicolor/128x128/apps/mezon.png", "644"],
    ["../../packaging/linux/icons/256x256/mezon.png", "usr/share/icons/hicolor/256x256/apps/mezon.png", "644"],
]